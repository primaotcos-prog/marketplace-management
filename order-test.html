<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Dashboard Test</title><link rel="stylesheet" href="/src/styles.css"></head><body><main id="page-content"><div id="order-test-root"></div></main><script type="module">import {createSyntheticOrder} from '/src/order-test.js';const root=document.getElementById('order-test-root');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));root.innerHTML='<div class="panel"><div class="panel-head"><div><strong>Order Dashboard Test</strong><div class="form-subtitle">Test internal dashboard tanpa membuat order GameBoost atau mengubah stock.</div></div></div><button class="action primary-small" id="test">Create Synthetic Order</button><div id="result" class="empty" style="margin-top:12px">Belum ada test.</div></div>';document.getElementById('test').onclick=async()=>{const b=document.getElementById('test'),r=document.getElementById('result');b.disabled=true;b.textContent='Creating...';try{const x=await createSyntheticOrder();r.innerHTML='<strong>SUCCESS</strong><br>Order: '+esc(x.row.external_order_id)+'<br>Product: '+esc(x.product.name)+'<br><br>Buka Dashboard → Orders → Refresh.'}catch(e){r.textContent='Gagal: '+e.message}finally{b.disabled=false;b.textContent='Create Synthetic Order'}};</script></body></html>
