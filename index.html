<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Marketplace Management dashboard"><title>Marketplace Management</title><link rel="stylesheet" href="./src/styles.css"><link rel="stylesheet" href="./src/products.css"></head>
<body>
<main id="auth-gate" class="auth-page"><section class="auth-card"><div class="brand"><div class="brand-mark">M</div><div><strong>Marketplace</strong><span>Management</span></div></div><h1>Sign in</h1><p class="auth-subtitle">Login untuk mengelola GameBoost.</p><form id="root-login-form" novalidate><label>Email<input id="root-login-email" type="email" autocomplete="username" required></label><label>Password<input id="root-login-password" type="password" autocomplete="current-password" required></label><button id="root-login-button" class="action primary" type="submit">Login</button><p id="root-login-message" class="auth-message" role="alert"></p></form></section></main>
<div id="app" class="app-shell" hidden><aside class="sidebar"><div class="brand"><div class="brand-mark">M</div><div><strong>Marketplace</strong><span>Management</span></div></div><div class="sidebar-label">MARKETPLACE</div><button class="marketplace active" data-page="dashboard"><span>🎮</span><span>GameBoost</span><span class="chevron">›</span></button><nav class="nav-group"><button class="nav-item active" data-page="dashboard">Dashboard</button><button class="nav-item" data-page="products">Products</button><button class="nav-item" data-page="listings">Listings</button><button class="nav-item" data-page="orders">Orders</button><button class="nav-item" data-page="stock">Stock</button><button class="nav-item" data-page="pricing">Pricing</button><button class="nav-item" data-page="delivery">Delivery</button></nav><div class="sidebar-spacer"></div><button class="nav-item" data-page="settings">Settings</button><div class="future-marketplace">+ Add marketplace later</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">GAMEBOOST</div><h1 id="page-title">Dashboard</h1></div><div class="topbar-actions"><span id="connection-dot" class="connection-dot"></span><span id="connection-text">Signed in</span><button id="logout" class="logout">Logout</button></div></header><section id="page-content" class="content"></section></main></div>
<script type="module">
import { supabase } from './src/supabase.js';
const gate=document.getElementById('auth-gate'),app=document.getElementById('app'),form=document.getElementById('root-login-form'),email=document.getElementById('root-login-email'),password=document.getElementById('root-login-password'),button=document.getElementById('root-login-button'),message=document.getElementById('root-login-message');
const MODULE_VERSION='20260827-2130';
async function loadDashboard(){gate.hidden=true;app.hidden=false;try{await import(`./src/app.js?v=${MODULE_VERSION}`);await import(`./src/orders.js?v=${MODULE_VERSION}`);await import(`./src/listing-edit.js?v=${MODULE_VERSION}`);await import(`./src/image-upload.js?v=${MODULE_VERSION}`);await import(`./src/listing-search.js?v=${MODULE_VERSION}`);await import(`./src/listing-tools.js?v=${MODULE_VERSION}`);await import(`./src/listing-status-tools.js?v=${MODULE_VERSION}`);await import(`./src/navigation-fix.js?v=${MODULE_VERSION}`);await import(`./src/listing-edit-fix.js?v=${MODULE_VERSION}`);await import(`./src/pricing.js?v=${MODULE_VERSION}`)}catch(e){console.error(e);message.textContent='Dashboard gagal dimuat: '+(e?.message||e)}}
async function check(){if(!supabase){message.textContent='Konfigurasi Supabase tidak tersedia.';button.disabled=true;return}try{const {data,error}=await supabase.auth.getSession();if(error)throw error;if(data?.session)await loadDashboard()}catch(e){message.textContent=e?.message||'Gagal memeriksa session.'}}
form.addEventListener('submit',async e=>{e.preventDefault();const eMail=email.value.trim(),pw=password.value;if(!eMail||!pw){message.textContent='Email dan password wajib diisi.';return}button.disabled=true;button.textContent='Memproses...';message.textContent='';try{const {data,error}=await supabase.auth.signInWithPassword({email:eMail,password:pw});if(error)throw error;if(!data?.session)throw new Error('Login berhasil tetapi session tidak diterima.');const {data:checkData,error:checkError}=await supabase.auth.getSession();if(checkError)throw checkError;if(!checkData?.session)throw new Error('Session belum tersimpan.');await loadDashboard()}catch(err){message.textContent=err?.message||'Login gagal.';button.disabled=false;button.textContent='Login'}});
supabase?.auth.onAuthStateChange((_event,session)=>{if(session){gate.hidden=true;app.hidden=false}else{gate.hidden=false;app.hidden=true}});check();
</script>
</body></html>
