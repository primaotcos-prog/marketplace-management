<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marketplace Management dashboard" />
    <title>Marketplace Management</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="auth-gate" class="auth-page">
      <section class="auth-card">
        <div class="brand"><div class="brand-mark">M</div><div><strong>Marketplace</strong><span>Management</span></div></div>
        <h1>Sign in</h1>
        <p class="auth-subtitle">Login untuk mengelola GameBoost.</p>
        <form id="login-form">
          <label>Email<input id="login-email" type="email" autocomplete="email" required /></label>
          <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button class="action primary" type="submit">Login</button>
          <p id="login-message" class="auth-message"></p>
        </form>
      </section>
    </main>
    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">M</div><div><strong>Marketplace</strong><span>Management</span></div></div>
        <div class="sidebar-label">MARKETPLACE</div>
        <button class="marketplace active" data-page="dashboard"><span>🎮</span><span>GameBoost</span><span class="chevron">›</span></button>
        <nav class="nav-group">
          <button class="nav-item active" data-page="dashboard">Dashboard</button><button class="nav-item" data-page="products">Products</button><button class="nav-item" data-page="listings">Listings</button><button class="nav-item" data-page="orders">Orders</button><button class="nav-item" data-page="stock">Stock</button><button class="nav-item" data-page="pricing">Pricing</button><button class="nav-item" data-page="delivery">Delivery</button>
        </nav>
        <div class="sidebar-spacer"></div><button class="nav-item" data-page="settings">Settings</button><div class="future-marketplace">+ Add marketplace later</div>
      </aside>
      <main class="main">
        <header class="topbar"><div><div class="eyebrow">GAMEBOOST</div><h1 id="page-title">Dashboard</h1></div><div class="topbar-actions"><span id="connection-dot" class="connection-dot"></span><span id="connection-text">Signed in</span><button id="logout" class="logout">Logout</button></div></header>
        <section id="page-content" class="content"></section>
      </main>
    </div>
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./src/listing-edit.js"></script>
  </body>
</html>
